name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # Job 1: Build Docker Image on GitHub-hosted Runner & Push to GHCR
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Job 2: Trigger Home Server Self-Hosted Runner to Deploy via SSH to Prod
  # =========================================================================
  deploy-production:
    name: Deploy to Production via Home Runner
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy to Production Server over SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_PORT_MAPPING: ${{ secrets.PROD_PORT_MAPPING || '80:80' }}
          IMAGE_URI: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "$PROD_HOST" ] || [ -z "$PROD_USER" ] || [ -z "$PROD_SSH_KEY" ]; then
            echo "❌ ERROR: One or more required secrets are missing!"
            echo "Please set PROD_HOST, PROD_USER, and PROD_SSH_KEY in your GitHub Repository Secrets."
            exit 1
          fi

          # Setup temporary deploy key with strict permissions
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          DEPLOY_KEY_FILE="$(mktemp ~/.ssh/deploy_key_XXXXXX)"
          echo "$PROD_SSH_KEY" > "$DEPLOY_KEY_FILE"
          chmod 600 "$DEPLOY_KEY_FILE"

          trap 'rm -f "$DEPLOY_KEY_FILE"' EXIT

          echo "🚀 Connecting to production server ($PROD_HOST:$PROD_PORT) via SSH from Home Server Runner..."

          ssh -i "$DEPLOY_KEY_FILE" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p "$PROD_PORT" \
              "$PROD_USER@$PROD_HOST" "bash -s" << EOF
            set -euo pipefail

            echo "🔑 Logging in to GitHub Container Registry on production..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true

            echo "📦 Pulling latest Docker image: $IMAGE_URI..."
            docker pull "$IMAGE_URI"

            echo "🛑 Stopping previous container (if running)..."
            docker stop ppp-presentation 2>/dev/null || true
            docker rm ppp-presentation 2>/dev/null || true

            echo "▶️ Starting new ppp-presentation container..."
            docker run -d \
              --name ppp-presentation \
              --restart unless-stopped \
              -p $PROD_PORT_MAPPING \
              "$IMAGE_URI"

            echo "🧹 Pruning old dangling images..."
            docker image prune -f || true

            echo "✅ Container deployment succeeded!"
            sleep 2
            docker ps --filter "name=ppp-presentation" --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF

          echo "🎉 Production deployment finished successfully!"
