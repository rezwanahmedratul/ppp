services:
  presentation:
    build:
      context: .
      dockerfile: Dockerfile
    image: ppp-presentation:latest
    container_name: ppp-presentation
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
